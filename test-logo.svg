<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" fill="none">
  <defs>
    <!-- Negative space mask around central globe so pillars do not touch it -->
    <mask id="globe-gap-mask">
      <rect x="0" y="0" width="580" height="470" fill="#ffffff" />
      <circle cx="290" cy="290" r="136" fill="#000000" />
    </mask>
  </defs>

  <!-- 1. The Complete Orbital Ring (Back Arc - passes behind pillars) -->
  <!-- Outer back arc: from left tip (20, 360) arched up to right tip (560, 360) -->
  <!-- Inner back arc: from right tip (522, 360) arched up to left tip (58, 360) -->
  <path
    d="M 20,360 A 270 92 0 0 1 560,360 L 522,360 A 232 70 0 0 0 58,360 Z"
    fill="currentColor"
  />

  <!-- 2. The Four Apostolic Pillars (Acts 2:42) with globe gap mask -->
  <g mask="url(#globe-gap-mask)" fill="currentColor">
    <!-- Pillar 1: Doctrine (Far Left) -->
    <rect x="137" y="198" width="54" height="178" rx="3" />
    <!-- Pillar 2: Fellowship (Inner Left) -->
    <rect x="221" y="92" width="54" height="313" rx="3" />
    <!-- Pillar 3: Breaking of Bread (Inner Right - Highest Peak) -->
    <rect x="305" y="20" width="54" height="385" rx="3" />
    <!-- Pillar 4: Prayers (Far Right) -->
    <rect x="389" y="160" width="54" height="216" rx="3" />
  </g>

  <!-- 3. The Complete Orbital Ring (Front Arc - passes in front, curving downward) -->
  <!-- Outer front arc: from left tip (20, 360) arched down to right tip (560, 360) -->
  <!-- Inner front arc: from right tip (522, 360) arched down to left tip (58, 360) -->
  <path
    d="M 20,360 A 270 92 0 0 0 560,360 L 522,360 A 232 70 0 0 1 58,360 Z"
    fill="currentColor"
  />

  <!-- 4. The Central Globe Sphere -->
  <circle cx="290" cy="290" r="114" fill="currentColor" />
</svg>